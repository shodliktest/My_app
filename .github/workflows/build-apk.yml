name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        env:
          VITE_AUTH_ENABLED: 'false'
        run: |
          set -e
          npm run build
          mkdir -p dist/client
          if [ -d .vercel/output/static ]; then
            cp -a .vercel/output/static/. dist/client/
          elif [ -d .output/public ]; then
            cp -a .output/public/. dist/client/
          else
            echo "ERROR: no static output"; ls -la; exit 1
          fi

          find dist/client -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.json' \) -print0 | \
            xargs -0 sed -i \
              -e 's|href="/assets/|href="./assets/|g' \
              -e 's|src="/assets/|src="./assets/|g' \
              -e 's|"/assets/|"./assets/|g' \
              -e "s|'/assets/|'./assets/|g" \
              -e 's|url(/assets/|url(./assets/|g' \
              -e 's|url("/assets/|url("./assets/|g' || true

          if [ ! -f dist/client/index.html ]; then
            JS=$(ls dist/client/assets/index-*.js 2>/dev/null | head -1 | xargs -r basename)
            CSS=$(ls dist/client/assets/styles-*.css 2>/dev/null | head -1 | xargs -r basename)
            {
              echo '<!DOCTYPE html><html lang="uz"><head>'
              echo '<meta charset="UTF-8"/>'
              echo '<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>'
              echo '<title>Elli</title>'
              [ -n "$CSS" ] && echo "<link rel=\"stylesheet\" href=\"./assets/$CSS\"/>"
              echo '</head><body style="margin:0;background:#f3eee4">'
              echo '<div id="root"></div>'
              [ -n "$JS" ] && echo "<script type=\"module\" src=\"./assets/$JS\"></script>"
              echo '</body></html>'
            } > dist/client/index.html
          else
            sed -i 's|href="/|href="./|g; s|src="/|src="./|g' dist/client/index.html || true
            sed -i 's|href="././|href="./|g; s|src="././|src="./|g' dist/client/index.html || true
          fi

          cat dist/client/index.html | head -40
          test -f dist/client/index.html

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Capacitor Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --no-audit --no-fund
          npx cap add android || true
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Elli-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
