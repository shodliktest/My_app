name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'LICENSE'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        env:
          VITE_AUTH_ENABLED: 'false'
        run: |
          npm run build

          echo "=== Looking for static output ==="
          find . -maxdepth 4 -type d \( -name "static" -o -name "client" -o -name "dist" -o -name ".output" \) 2>/dev/null | head -30
          find . -maxdepth 5 -name "index.html" -not -path "./node_modules/*" 2>/dev/null | head -20

          mkdir -p dist/client

          if [ -d ".vercel/output/static" ]; then
            echo "Using .vercel/output/static"
            cp -a .vercel/output/static/. dist/client/
          elif [ -d ".output/public" ]; then
            echo "Using .output/public"
            cp -a .output/public/. dist/client/
          elif [ -d "dist" ] && [ -f "dist/index.html" ]; then
            echo "Using dist/"
            cp -a dist/. dist/client/
          else
            HTML=$(find . -maxdepth 5 -name "index.html" -not -path "./node_modules/*" | head -1)
            if [ -n "$HTML" ]; then
              DIR=$(dirname "$HTML")
              echo "Using $DIR"
              cp -a "$DIR"/. dist/client/
            else
              echo "ERROR: No static build output found"
              ls -la
              ls -la .vercel/output/ 2>/dev/null || true
              exit 1
            fi
          fi

          if [ ! -f "dist/client/index.html" ]; then
            echo "index.html missing — creating SPA shell"
            MAIN_JS=$(ls dist/client/assets/index-*.js 2>/dev/null | head -1 | xargs -r basename)
            MAIN_CSS=$(ls dist/client/assets/styles-*.css 2>/dev/null | head -1 | xargs -r basename)
            cat > dist/client/index.html << HTML
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Elli</title>
  ${MAIN_CSS:+<link rel="stylesheet" href="./assets/$MAIN_CSS" />}
</head>
<body>
  <div id="root"></div>
  ${MAIN_JS:+<script type="module" src="./assets/$MAIN_JS"></script>}
</body>
</html>
HTML
          fi

          echo "=== dist/client contents ==="
          ls -la dist/client/ | head -30
          ls -la dist/client/assets/ 2>/dev/null | head -20 || true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor & add Android platform
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --no-audit --no-fund
          npx cap add android || true
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Elli-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Summary
        run: |
          echo "### APK tayyor!" >> $GITHUB_STEP_SUMMARY
          echo "Actions → Artifacts → Elli-debug-apk dan yuklab oling." >> $GITHUB_STEP_SUMMARY
          ls -lh android/app/build/outputs/apk/debug/ || true

 
