name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'LICENSE'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        env:
          VITE_AUTH_ENABLED: 'false'
        run: |
          npm run build
          echo "=== Build output search ==="
          find . -maxdepth 4 \( -name "index.html" -o -type d -name "client" -o -type d -name "dist" -o -type d -name ".output" \) 2>/dev/null | head -40
          if [ -d "dist/client" ]; then
            echo "Found dist/client"
          elif [ -d "dist" ] && [ -f "dist/index.html" ]; then
            mkdir -p dist/client
            cp -a dist/. dist/client/ 2>/dev/null || true
          elif [ -d ".output/public" ]; then
            mkdir -p dist/client
            cp -a .output/public/. dist/client/
          else
            HTML=$(find . -maxdepth 4 -name "index.html" -not -path "./node_modules/*" | head -1)
            if [ -n "$HTML" ]; then
              DIR=$(dirname "$HTML")
              mkdir -p dist/client
              cp -a "$DIR"/. dist/client/
              echo "Copied from $DIR"
            else
              echo "No build output found"
              ls -la
              exit 1
            fi
          fi
          ls -la dist/client/ | head -25

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor & add Android platform
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --no-audit --no-fund
          npx cap add android || true
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Elli-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Summary
        run: |
          echo "### APK tayyor!" >> $GITHUB_STEP_SUMMARY
          echo "Actions → Artifacts → Elli-debug-apk dan yuklab oling." >> $GITHUB_STEP_SUMMARY
          ls -lh android/app/build/outputs/apk/debug/ || true
