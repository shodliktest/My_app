name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        env:
          VITE_AUTH_ENABLED: 'false'
        run: |
          set -e
          npm run build
          echo "=== Build done, searching output ==="
          find . -maxdepth 5 -type d \( -name static -o -name client -o -name dist -o -name .output \) 2>/dev/null | head -20
          find . -maxdepth 6 -name index.html -not -path './node_modules/*' 2>/dev/null | head -10
          mkdir -p dist/client
          if [ -d .vercel/output/static ]; then
            echo "Copying .vercel/output/static"
            cp -a .vercel/output/static/. dist/client/
          elif [ -d .output/public ]; then
            echo "Copying .output/public"
            cp -a .output/public/. dist/client/
          elif [ -f dist/index.html ]; then
            echo "Copying dist"
            cp -a dist/. dist/client/ || true
          else
            echo "ERROR: no static output"
            ls -la
            ls -la .vercel 2>/dev/null || true
            ls -la .vercel/output 2>/dev/null || true
            exit 1
          fi
          if [ ! -f dist/client/index.html ]; then
            echo "Creating index.html"
            JS=$(ls dist/client/assets/index-*.js 2>/dev/null | head -1 | xargs -r basename)
            CSS=$(ls dist/client/assets/styles-*.css 2>/dev/null | head -1 | xargs -r basename)
            echo '<!DOCTYPE html><html lang="uz"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><title>Elli</title>' > dist/client/index.html
            if [ -n "$CSS" ]; then echo "<link rel=\"stylesheet\" href=\"./assets/$CSS\"/>" >> dist/client/index.html; fi
            echo '</head><body><div id="root"></div>' >> dist/client/index.html
            if [ -n "$JS" ]; then echo "<script type=\"module\" src=\"./assets/$JS\"></script>" >> dist/client/index.html; fi
            echo '</body></html>' >> dist/client/index.html
          fi
          echo "=== dist/client ==="
          ls -la dist/client/ | head -25
          test -f dist/client/index.html && echo "index.html OK" || (echo "index.html MISSING"; exit 1)

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Capacitor Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --no-audit --no-fund
          npx cap add android || true
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Elli-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
