name: Build Android APK (Offline SPA)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build SPA shell
        env:
          VITE_AUTH_ENABLED: "false"
        run: |
          set -e
          npm run build
          echo "=== search outputs ==="
          find . -maxdepth 5 -type d \( -name static -o -name client -o -name dist -o -name .output -o -name public \) 2>/dev/null | head -40
          find . -maxdepth 6 -name index.html -not -path './node_modules/*' 2>/dev/null | head -20

          mkdir -p dist/client
          if [ -d .vercel/output/static ]; then
            cp -a .vercel/output/static/. dist/client/
          elif [ -d .output/public ]; then
            cp -a .output/public/. dist/client/
          elif [ -d dist/client ] && [ -f dist/client/index.html ]; then
            true
          elif [ -d dist ] && [ -f dist/index.html ]; then
            cp -a dist/. dist/client/
          else
            echo "ERROR: no static shell"; ls -la; exit 1
          fi

          cp -f public/offline-no-internet.png dist/client/ 2>/dev/null || true
          cp -f public/offline.html dist/client/ 2>/dev/null || true
          cp -f public/shodlik-education-logo.png dist/client/ 2>/dev/null || true

          find dist/client -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' \) -print0 2>/dev/null | \
            xargs -0 sed -i \
              -e 's|href="/assets/|href="./assets/|g' \
              -e 's|src="/assets/|src="./assets/|g' \
              -e 's|"/assets/|"./assets/|g' \
              -e "s|'/assets/|'./assets/|g" \
              -e 's|href="/|href="./|g' \
              -e 's|src="/|src="./|g' || true
          find dist/client -name '*.html' -print0 2>/dev/null | xargs -0 sed -i 's|\./\./|./|g' || true

          if [ ! -f dist/client/index.html ]; then
            JS=$(ls dist/client/assets/index-*.js 2>/dev/null | head -1 | xargs -r basename)
            CSS=$(ls dist/client/assets/styles-*.css 2>/dev/null | head -1 | xargs -r basename)
            {
              echo '<!DOCTYPE html><html lang="uz"><head><meta charset="UTF-8"/>'
              echo '<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>'
              echo '<title>Shodlik Education</title>'
              [ -n "$CSS" ] && echo "<link rel=\"stylesheet\" href=\"./assets/$CSS\"/>"
              echo '</head><body style="margin:0;background:#FCFAf6"><div id="root"></div>'
              [ -n "$JS" ] && echo "<script type=\"module\" src=\"./assets/$JS\"></script>"
              echo '</body></html>'
            } > dist/client/index.html
          fi

          echo "=== index.html head ==="
          head -30 dist/client/index.html
          ls -la dist/client/ | head -20
          test -f dist/client/index.html

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Capacitor offline package
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --no-audit --no-fund
          npx cap add android || true
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Shodlik-Education-offline-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
