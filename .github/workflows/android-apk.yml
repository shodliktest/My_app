name: Shodlik Education Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. GitHub repository'ni yuklash
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Node.js
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm

      # 3. Dependencies
      #
      # MUHIM:
      # npm ci eski package-lock.json sababli ishlamayotgan edi.
      # npm install package.json va package-lock.json ni
      # qayta moslashtiradi.
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund

      # 4. Web application build
      - name: Build web application
        run: npm run build:mobile
        env:
          VITE_AUTH_ENABLED: "false"
          VITE_RESPONSIVEVOICE_KEY: ${{ secrets.RESPONSIVEVOICE_KEY }}

      # 5. Capacitor Android project'ni tayyorlash
      - name: Prepare Capacitor Android
        run: npm run mobile:prepare

      # 6. Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # 7. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 8. Android Debug APK build
      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      # 9. APK'ni GitHub Actions artifact sifatida saqlash
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shodlik-education-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
