name: Shodlik Education Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build mobile web shell
        run: npm run build:mobile
        env:
          VITE_AUTH_ENABLED: "false"
          VITE_RESPONSIVEVOICE_KEY: ${{ secrets.RESPONSIVEVOICE_KEY }}

      - name: Verify Capacitor web assets
        run: |
          test -f .output/public/index.html
          test -s .output/public/index.html
          test -f .output/public/shodlik-mobile.json

      - name: Prepare Capacitor Android
        run: npm run mobile:prepare

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages required by Gradle
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          # Capacitor/Gradle normally declares the compile SDK in
          # variables.gradle. Read it from the generated project so the
          # workflow follows the project instead of hard-coding an API level.
          COMPILE_SDK="$(grep -RhoE 'compileSdkVersion[[:space:]]*=[[:space:]]*[0-9]+' . 2>/dev/null \
            | grep -oE '[0-9]+' | head -n 1 || true)"

          if [ -z "$COMPILE_SDK" ]; then
            # Capacitor 8's Android minimums use compile/target SDK 36.
            COMPILE_SDK="36"
          fi

          echo "Installing Android platform: android-${COMPILE_SDK}"
          sdkmanager "platform-tools" "platforms;android-${COMPILE_SDK}"

          # Capacitor 8 requires Android SDK 36. Install the matching
          # build-tools explicitly so a fresh GitHub runner is deterministic.
          sdkmanager "build-tools;36.0.0"

          yes | sdkmanager --licenses >/dev/null || true

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shodlik-education-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
