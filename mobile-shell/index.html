<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#0a1628" />
  <title>Shodlik Education</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #0a1628; color: #fff; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }

    #appFrame {
      position: fixed; inset: 0; z-index: 1;
      width: 100%; height: 100%; border: 0; background: #fff;
      opacity: 0; transition: opacity 0.25s ease;
    }
    #appFrame.ready { opacity: 1; }

    #splash {
      position: fixed; inset: 0; z-index: 20;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 50% 30%, #123a7a 0%, #0a1628 70%);
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }
    #splash.hide { opacity: 0; visibility: hidden; pointer-events: none; }
    #splash img {
      width: min(72vw, 280px); height: auto; border-radius: 28px;
      box-shadow: 0 20px 60px rgba(0, 80, 200, 0.35);
    }
    #splash .name { margin-top: 1.25rem; font-size: 1.15rem; font-weight: 700; }
    #splash .sub { margin-top: 0.35rem; font-size: 0.8rem; opacity: 0.65; letter-spacing: 0.12em; text-transform: uppercase; }
    #splash .loader {
      margin-top: 2rem; width: 36px; height: 36px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #3b9eff; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #offline { position: fixed; inset: 0; z-index: 10; display: none; background: #0a1a4a; }
    #offline.show { display: block; }
    #offline img { width: 100%; height: 100%; object-fit: cover; object-position: center; }
    #offline .hit {
      position: absolute; left: 50%; bottom: 16%; transform: translateX(-50%);
      width: min(70%, 320px); height: 56px; border: 0; border-radius: 999px;
      background: transparent; cursor: pointer;
    }
    #offline .retry-bar {
      position: absolute; left: 0; right: 0; bottom: 5%;
      display: flex; justify-content: center; padding: 0 1rem;
    }
    #offline .retry-bar button {
      min-width: 70%; max-width: 320px; height: 52px; border: 0; border-radius: 999px;
      background: linear-gradient(180deg, #3b9eff, #1a6fff);
      color: #fff; font-weight: 700; font-size: 1rem;
      box-shadow: 0 10px 28px rgba(26,111,255,0.4);
    }
  </style>
</head>
<body>
  <!--
    Ilova shu WebView ICHIDA, iframe orqali ochiladi — top-level
    window.location o'zgarmaydi. Shu sababli Android hech qachon buni
    "tashqi link" deb hisoblamaydi va tizim brauzeriga (Chrome) otib
    yubormaydi: butun sayohat appId'ning o'z WebView'ida qoladi.
  -->
  <iframe
    id="appFrame"
    title="Shodlik Education"
    allow="microphone; autoplay"
  ></iframe>

  <div id="splash">
    <img src="./logo.png" alt="Shodlik Education" />
    <div class="name">SHodlik Education</div>
    <div class="sub">Learn English</div>
    <div class="loader" aria-hidden="true"></div>
  </div>

  <div id="offline" role="alert" aria-live="assertive">
    <img src="./offline-no-internet.png" alt="Internet aloqasi yo'q" />
    <button type="button" class="hit" id="retryHit" aria-label="Qayta urinish"></button>
    <div class="retry-bar">
      <button type="button" id="retryBtn">Qayta urinish</button>
    </div>
  </div>

  <script>
    var APP_URL = "https://myapp-rose-alpha.vercel.app";
    var splash = document.getElementById("splash");
    var offline = document.getElementById("offline");
    var frame = document.getElementById("appFrame");
    var minSplashMs = 1400;
    var started = 0;
    var loadTimer = null;
    var settled = false;

    function clearLoadTimer() {
      if (loadTimer !== null) { clearTimeout(loadTimer); loadTimer = null; }
    }

    // Ilova muvaffaqiyatli yuklanganda: splash yashirinadi, iframe ko'rinadi.
    // Bu YAGONA "muvaffaqiyat" yo'li — hech qanday brauzer xato sahifasi
    // hech qachon ekranga chiqmaydi, chunki xato bo'lsa bu funksiya
    // umuman chaqirilmaydi (pastdagi onerror/timeout ishlaydi).
    function showApp() {
      if (settled) return;
      settled = true;
      clearLoadTimer();
      offline.classList.remove("show");
      frame.classList.add("ready");
      splash.classList.add("hide");
    }

    // Muvaffaqiyatsizlik: faqat bizning rasmimiz ko'rinadi, hech qanday
    // "ERR_INTERNET_DISCONNECTED" yoki shunga o'xshash tizim xatosi emas —
    // chunki iframe navigatsiyasi bu sahifadan (top-level) chiqib ketmaydi,
    // muvaffaqiyatsiz iframe shunchaki bo'sh qoladi va biz uni yashiramiz.
    function showOffline() {
      if (settled) return;
      settled = true;
      clearLoadTimer();
      frame.classList.remove("ready");
      frame.src = "about:blank";
      splash.classList.add("hide");
      offline.classList.add("show");
    }

    function attemptLoad() {
      settled = false;
      clearLoadTimer();
      frame.classList.remove("ready");

      if (!navigator.onLine) {
        var wait = Math.max(0, minSplashMs - (Date.now() - started));
        setTimeout(showOffline, wait);
        return;
      }

      // Ilova sahifasi ichkarida (bosslar orqali) sahifani navigate qilishi
      // mumkin bo'lgani uchun, biz faqat "load qila oldimi" ni kuzatamiz —
      // load hodisasi otilgach ham ichkarida real render bo'lganini
      // kutish uchun kichik qo'shimcha vaqt beramiz.
      frame.onload = function () {
        var wait = Math.max(0, minSplashMs - (Date.now() - started));
        setTimeout(showApp, wait);
      };
      frame.onerror = function () {
        var wait = Math.max(0, minSplashMs - (Date.now() - started));
        setTimeout(showOffline, wait);
      };

      // Sekin yoki uzilib qolgan ulanish uchun umumiy timeout.
      loadTimer = setTimeout(showOffline, 12000);

      frame.src = APP_URL + "/";
    }

    function boot() {
      started = Date.now();
      attemptLoad();
    }

    function retry() {
      splash.classList.remove("hide");
      offline.classList.remove("show");
      boot();
    }

    document.getElementById("retryBtn").addEventListener("click", retry);
    document.getElementById("retryHit").addEventListener("click", retry);
    window.addEventListener("online", function () {
      if (offline.classList.contains("show")) retry();
    });

    boot();
  </script>
</body>
</html>
