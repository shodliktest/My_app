<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Shodlik Education</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #0a1a4a; }
    img { width: 100%; height: 100%; object-fit: cover; object-position: center; }
    .actions {
      position: fixed; left: 0; right: 0; bottom: 6%;
      display: flex; justify-content: center; padding: 0 1.5rem; gap: 0.75rem;
    }
    button {
      min-width: 42%; max-width: 14rem; height: 3rem;
      border: 0; border-radius: 999px;
      background: linear-gradient(180deg, #3b9eff, #1a6fff);
      color: #fff; font: 600 0.95rem/1 system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <img src="./offline-no-internet.png" alt="Internet aloqasi yo'q" />
  <div class="actions">
    <button type="button" id="retry">Qayta urinish</button>
    <button type="button" id="home" style="background:#fff;color:#0a1a4a">Bosh sahifa</button>
  </div>
  <script>
    document.getElementById("retry").onclick = function () {
      location.href = "./index.html";
    };
    document.getElementById("home").onclick = function () {
      location.href = "./index.html";
    };
    window.addEventListener("online", function () {
      location.href = "./index.html";
    });
  </script>
</body>
</html>
